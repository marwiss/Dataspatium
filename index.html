<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Dataspatium</title>
  <link rel="icon" type="image/svg+xml" href="src/ui/design/favicon.svg">
  <!-- Installable when served from a web server (the manifest is ignored when the page is opened from a folder). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="src/ui/design/icon-192.png">
  <meta name="theme-color" content="#2b6cb0">
  <link rel="stylesheet" href="src/ui/design/tokens.css">
  <link rel="stylesheet" href="src/ui/design/base.css">
  <link rel="stylesheet" href="src/ui/design/components.css">
  <link rel="stylesheet" href="src/ui/shell/shell.css">
  <!-- Classic scripts only: pages opened via file:// cannot load ES module files. -->
  <script src="src/boot.js"></script>
</head>
<body>
  <noscript>Dataspatium kräver JavaScript. Dataspatium requires JavaScript.</noscript>
  <div id="app">
    <p class="dm-muted" style="padding: 24px">Dataspatium …</p>
  </div>
  <script>
    document.addEventListener('dataspatium:ready', function () {
      Dataspatium.require('app').start(document.getElementById('app')).catch(function (err) {
        console.error(err);
        document.getElementById('app').textContent = 'Dataspatium kunde inte starta: ' + (err && err.message || err);
      });
    });
    document.addEventListener('dataspatium:boot-error', function (ev) {
      document.getElementById('app').textContent = 'Dataspatium kunde inte starta: ' + ev.detail;
    });
  </script>
</body>
</html>
