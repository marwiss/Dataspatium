<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Dataspatium – tester</title>
  <link rel="icon" type="image/svg+xml" href="../src/ui/design/favicon.svg">
  <!-- The tests assert Swedish messages and drive the shell themselves; pin the UI language and keep the course closed. -->
  <script>try { localStorage.setItem('dataspatium.lang', 'sv'); localStorage.setItem('dataspatium.course', '{"status":"closed","step":0}'); localStorage.setItem('dataspatium.consent', 'granted'); } catch (e) { /* storage may be unavailable */ }</script>
  <link rel="stylesheet" href="../src/ui/design/tokens.css">
  <link rel="stylesheet" href="../src/ui/design/base.css">
  <link rel="stylesheet" href="../src/ui/design/components.css">
  <link rel="stylesheet" href="../src/ui/shell/shell.css">
  <style>
    body { overflow: auto; padding: 24px; }
    ul.results { list-style: none; padding: 0; }
    ul.results li { font-family: var(--dm-font-mono); font-size: 13px; padding: 2px 0; }
    .ok { color: var(--dm-ok); } .fail { color: var(--dm-error); }
  </style>
  <script src="../src/boot.js"></script>
</head>
<body>
  <h1>Dataspatium: automatiska tester</h1>
  <p class="dm-muted">Resultat skrivs även till konsolen som <code>DATASPATIUM-LOG</code>-rader och avslutas med <code>DATASPATIUM-TESTS: pass=N fail=M</code>.</p>
  <p id="summary" class="dm-muted">Kör …</p>
  <ul id="results" class="results"></ul>
  <script>
    document.addEventListener('dataspatium:ready', async function () {
      var files = ['harness.js', 'a11y.js', 'fixtures/api-fixtures.js', 'fixtures/access-fixture.js', 'platform.test.js', 'i18n.test.js', 'sqlite.test.js', 'data.test.js', 'io.test.js', 'operations.test.js', 'operations2.test.js', 'api.test.js', 'viz.test.js', 'docgen.test.js', 'updates.test.js', 'pseudonymize.test.js', 'indexes.test.js', 'bundle.test.js', 'maps.test.js', 'rules.test.js', 'formats2.test.js', 'formats3.test.js', 'sync.test.js', 'basemaps.test.js', 'geo-ops.test.js', 'stream.test.js', 'metadata.test.js', 'shortnames.test.js', 'dashboards.test.js', 'ui.test.js', 'statusbar.test.js', 'soka.test.js', 'folders.test.js', 'tooltips.test.js', 'consent.test.js', 'p2p.test.js', 'qr.test.js', 'links.test.js', 'review.test.js', 'devices.test.js', 'mobile.test.js', 'querybuilder.test.js', 'fraga.test.js', 'lists-filter.test.js', 'help.test.js', 'present.test.js', 'bridge.test.js', 'families.test.js', 'access.test.js', 'linked.test.js', 'websocket.test.js', 'palette.test.js', 'r.test.js', 'python.test.js', 'code-steps.test.js', 'documents.test.js', 'text-tools.test.js', 'map.test.js', 'geodata.test.js', 'plan.test.js', 'plan-nordic.test.js', 'formats.test.js', 'notebooks.test.js', 'regex.test.js', 'fixtures/sdmx-fixtures.js', 'sdmx.test.js', 'refresh.test.js', 'valuelabels.test.js', 'comments.test.js', 'github.test.js', 'a11y.test.js', 'flows.test.js', 'course.test.js'];
      for (var i = 0; i < files.length; i++) await Dataspatium.assets.loadScript(files[i]);
      Dataspatium.require('tests/harness').run(document.getElementById('results'), document.getElementById('summary'));
    });
    document.addEventListener('dataspatium:boot-error', function (ev) {
      console.log('DATASPATIUM-LOG: FAIL | boot :: ' + ev.detail);
      console.log('DATASPATIUM-TESTS: pass=0 fail=1');
    });
  </script>
</body>
</html>
