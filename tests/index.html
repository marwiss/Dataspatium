<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Dataspatium – tester</title>
  <link rel="stylesheet" href="../src/ui/design/tokens.css">
  <link rel="stylesheet" href="../src/ui/design/base.css">
  <link rel="stylesheet" href="../src/ui/design/components.css">
  <link rel="stylesheet" href="../src/ui/shell/shell.css">
  <style>
    body { overflow: auto; padding: 24px; }
    ul.results { list-style: none; padding: 0; }
    ul.results li { font-family: var(--dm-font-mono); font-size: 13px; padding: 2px 0; }
    .ok { color: var(--dm-ok); } .fail { color: var(--dm-error); }
  </style>
  <script src="../src/boot.js"></script>
</head>
<body>
  <h1>Dataspatium: automatiska tester</h1>
  <p class="dm-muted">Resultat skrivs även till konsolen som <code>DATASPATIUM-LOG</code>-rader och avslutas med <code>DATASPATIUM-TESTS: pass=N fail=M</code>.</p>
  <p id="summary" class="dm-muted">Kör …</p>
  <ul id="results" class="results"></ul>
  <script>
    document.addEventListener('dataspatium:ready', async function () {
      var files = ['harness.js', 'fixtures/api-fixtures.js', 'platform.test.js', 'sqlite.test.js', 'data.test.js', 'io.test.js', 'operations.test.js', 'api.test.js', 'viz.test.js', 'docgen.test.js', 'updates.test.js', 'ui.test.js', 'r.test.js', 'formats.test.js'];
      for (var i = 0; i < files.length; i++) await Dataspatium.assets.loadScript(files[i]);
      Dataspatium.require('tests/harness').run(document.getElementById('results'), document.getElementById('summary'));
    });
    document.addEventListener('dataspatium:boot-error', function (ev) {
      console.log('DATASPATIUM-LOG: FAIL | boot :: ' + ev.detail);
      console.log('DATASPATIUM-TESTS: pass=0 fail=1');
    });
  </script>
</body>
</html>
